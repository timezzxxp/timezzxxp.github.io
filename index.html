<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ПДД-тян недовольно объясняет правила ~ цундере-презентация</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Comic Sans MS', Roboto, system-ui, sans-serif;
            background: linear-gradient(145deg, #2a1a2e 0%, #1a0f22 50%, #12081a 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Плавающие сердечки на фоне */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(255, 105, 180, 0.12) 0%, transparent 25%),
                radial-gradient(circle at 85% 70%, rgba(255, 105, 180, 0.10) 0%, transparent 30%),
                radial-gradient(circle at 50% 90%, rgba(200, 100, 255, 0.08) 0%, transparent 40%);
            pointer-events: none;
            z-index: 0;
        }

        .presentation-wrapper {
            max-width: 1100px;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        /* Переключатель языка */
        .lang-switch {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-bottom: 14px;
        }

        .lang-btn {
            background: rgba(255, 105, 180, 0.08);
            border: 1.5px solid rgba(255, 105, 180, 0.35);
            color: #e0a8c8;
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.2s;
            backdrop-filter: blur(5px);
        }

        .lang-btn:hover {
            border-color: #ff69b4;
            color: #ffb6d9;
        }

        .lang-btn.active {
            background: #ff69b4;
            color: #1a0f22;
            border-color: #ff69b4;
            box-shadow: 0 0 18px rgba(255, 105, 180, 0.55);
        }

        /* Контейнер слайдера */
        .slider-container {
            position: relative;
            border-radius: 32px;
            overflow: hidden;
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.75), 0 0 0 1px rgba(255, 105, 180, 0.25);
            background: #1a0f22;
            transition: box-shadow 0.3s;
        }

        .slider-container:hover {
            box-shadow: 0 35px 60px rgba(0, 0, 0, 0.85), 0 0 0 2px rgba(255, 105, 180, 0.45);
        }

        .slides {
            display: flex;
            transition: transform 0.45s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            will-change: transform;
        }

        .slide {
            flex: 0 0 100%;
            padding: 44px 40px 52px;
            min-height: 600px;
            display: flex;
            flex-direction: column;
            background: radial-gradient(circle at 20% 30%, #2e1c36, #150b1e 90%);
            color: #f3e4ee;
            border-right: 1px solid rgba(255, 105, 180, 0.12);
        }

        /* Заголовки */
        .slide h1 {
            font-size: 2.9rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            line-height: 1.2;
            color: #ffffff;
            text-shadow: 0 4px 15px rgba(255, 105, 180, 0.35);
            margin-bottom: 8px;
            position: relative;
        }

        .slide h1::after {
            content: '';
            display: block;
            width: 120px;
            height: 5px;
            background: linear-gradient(90deg, #ff69b4, #c864ff, #ff69b4);
            border-radius: 4px;
            margin-top: 14px;
            box-shadow: 0 0 15px rgba(255, 105, 180, 0.7);
        }

        .slide h2 {
            font-size: 1.95rem;
            font-weight: 600;
            color: #ff9ecf;
            margin-bottom: 24px;
            letter-spacing: -0.3px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .slide p {
            font-size: 1.18rem;
            line-height: 1.6;
            color: #d9c4d6;
            margin-bottom: 16px;
        }

        .highlight {
            color: #ff9ecf;
            font-weight: 700;
        }

        /* Реплики цундере */
        .tsundere-line {
            background: rgba(255, 105, 180, 0.09);
            border: 1.5px dashed rgba(255, 105, 180, 0.45);
            border-radius: 20px;
            padding: 16px 22px;
            margin-bottom: 22px;
            font-size: 1.15rem;
            color: #ffd6ec;
            position: relative;
            font-style: italic;
        }

        .tsundere-line::before {
            content: "« ";
            color: #ff69b4;
            font-weight: bold;
            font-style: normal;
        }

        .tsundere-line::after {
            content: " »";
            color: #ff69b4;
            font-weight: bold;
            font-style: normal;
        }

        .tsundere-line .b-baka {
            font-style: normal;
            font-weight: 800;
            color: #ff69b4;
            text-shadow: 0 0 10px rgba(255, 105, 180, 0.6);
        }

        /* Сетки */
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 14px;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-top: 14px;
        }

        /* Карточки */
        .card {
            background: rgba(40, 22, 50, 0.85);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 105, 180, 0.28);
            border-radius: 22px;
            padding: 20px 18px;
            transition: transform 0.2s, border-color 0.2s;
            box-shadow: 0 10px 20px -8px rgba(0, 0, 0, 0.7);
        }

        .card:hover {
            border-color: #ff69b4;
            transform: translateY(-3px) rotate(-0.3deg);
            background: rgba(52, 30, 64, 0.95);
        }

        .card-icon {
            font-size: 2.3rem;
            margin-bottom: 8px;
            display: block;
        }

        .card h3 {
            font-size: 1.3rem;
            color: #ff9ecf;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .card p {
            font-size: 0.98rem;
            margin-bottom: 6px;
            color: #cbb0c8;
        }

        .card ul {
            padding-left: 18px;
            margin: 8px 0 4px;
            color: #cbb0c8;
            font-size: 0.96rem;
            line-height: 1.55;
        }

        .card li {
            margin-bottom: 5px;
        }

        /* Кастомный список */
        .custom-list {
            list-style: none;
            padding: 0;
            margin-top: 10px;
        }

        .custom-list li {
            font-size: 1.08rem;
            padding: 9px 0 9px 36px;
            position: relative;
            border-bottom: 1px solid rgba(255, 105, 180, 0.12);
            color: #e4d0e0;
        }

        .custom-list li::before {
            content: "♥";
            position: absolute;
            left: 8px;
            color: #ff69b4;
            font-weight: bold;
            font-size: 1.2rem;
        }

        /* Акцентный блок */
        .accent-block {
            background: rgba(255, 105, 180, 0.1);
            border-left: 6px solid #ff69b4;
            padding: 18px 22px;
            border-radius: 16px;
            margin: 18px 0 8px;
            font-size: 1.15rem;
            color: #f6e6f2;
        }

        /* Значки */
        .sign-row {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
            font-size: 2.3rem;
            flex-wrap: wrap;
            gap: 12px;
        }

        .sign-item {
            background: #1f1028;
            padding: 14px 20px;
            border-radius: 16px;
            border: 1px solid rgba(255, 105, 180, 0.35);
            text-align: center;
            min-width: 100px;
        }

        .sign-item span {
            display: block;
            font-size: 0.85rem;
            color: #ff9ecf;
            margin-top: 6px;
            font-weight: 500;
        }

        /* Навигация */
        .nav-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 28px;
            margin-top: 26px;
        }

        .nav-btn {
            background: rgba(255, 105, 180, 0.07);
            border: 1.5px solid rgba(255, 105, 180, 0.55);
            color: #ff9ecf;
            width: 58px;
            height: 58px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: 400;
            cursor: pointer;
            transition: all 0.2s;
            backdrop-filter: blur(5px);
            line-height: 1;
            user-select: none;
        }

        .nav-btn:hover {
            background: #ff69b4;
            color: #1a0f22;
            border-color: #ff69b4;
            transform: scale(1.08);
            box-shadow: 0 0 28px rgba(255, 105, 180, 0.6);
        }

        .nav-btn:active {
            transform: scale(0.95);
        }

        .dots {
            display: flex;
            gap: 13px;
        }

        .dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: rgba(255, 105, 180, 0.25);
            cursor: pointer;
            transition: all 0.25s;
            border: 1px solid rgba(255, 105, 180, 0.45);
        }

        .dot.active {
            background: #ff69b4;
            width: 36px;
            border-radius: 20px;
            box-shadow: 0 0 14px #ff69b4;
            border-color: #ff69b4;
        }

        .slide-counter {
            color: #b088a8;
            font-size: 1rem;
            font-weight: 500;
            letter-spacing: 2px;
            min-width: 70px;
            text-align: center;
        }

        .footer-note {
            color: #7a5a72;
            margin-top: 16px;
            font-size: 0.9rem;
            text-align: center;
            letter-spacing: 0.5px;
            font-style: italic;
        }

        /* "Чиби" персонаж-эмодзи в углу слайда */
        .chibi-corner {
            position: absolute;
            bottom: 18px;
            right: 24px;
            font-size: 2.6rem;
            opacity: 0.55;
            filter: drop-shadow(0 0 8px rgba(255, 105, 180, 0.7));
            animation: float 3s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(4deg); }
        }

        @media (max-width: 760px) {
            .slide {
                padding: 30px 20px 38px;
                min-height: 540px;
            }
            .slide h1 { font-size: 2rem; }
            .slide h2 { font-size: 1.5rem; }
            .grid-2, .grid-3 {
                grid-template-columns: 1fr;
                gap: 14px;
            }
            .nav-btn {
                width: 48px;
                height: 48px;
                font-size: 1.6rem;
            }
            .nav-controls { gap: 14px; }
            .card { padding: 15px; }
            .sign-row { font-size: 1.7rem; }
            .accent-block { padding: 14px 16px; font-size: 1rem; }
            .tsundere-line { font-size: 1rem; padding: 13px 16px; }
            .chibi-corner { font-size: 2rem; bottom: 10px; right: 14px; }
        }
    </style>
</head>

    /* ======================= СМЕНА ЯЗЫКА ======================= */
    let currentLang = 'ru';

    function applyLanguage(lang) {
        currentLang = lang;
        const dict = translations[lang];

        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (dict[key] !== undefined) el.innerHTML = dict[key];
        });

        document.querySelectorAll('[data-i18n-html]').forEach(el => {
            const key = el.getAttribute('data-i18n-html');
            if (dict[key] !== undefined) el.innerHTML = dict[key];
        });

        document.getElementById('footerNote').textContent = dict.footer || '';

        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.lang === lang);
        });

        document.documentElement.lang = lang;
        document.title = lang === 'ru'
            ? 'ПДД-тян недовольно объясняет правила ~ цундере-презентация'
            : 'Traffic Rules-chan reluctantly explains ~ tsundere presentation';
    }

    document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.addEventListener('click', () => applyLanguage(btn.dataset.lang));
    });

    /* ======================= СЛАЙДЕР ======================= */
    const slidesContainer = document.getElementById('slides');
    const slides = document.querySelectorAll('.slide');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const dotsContainer = document.getElementById('dotsContainer');
    const counter = document.getElementById('counter');
    const totalSlides = slides.length;
    let currentIndex = 0;

    function createDots() {
        dotsContainer.innerHTML = '';
        for (let i = 0; i < totalSlides; i++) {
            const dot = document.createElement('div');
            dot.classList.add('dot');
            if (i === 0) dot.classList.add('active');
            dot.addEventListener('click', () => goToSlide(i));
            dotsContainer.appendChild(dot);
        }
    }

    function updateUI() {
        const dots = document.querySelectorAll('.dot');
        dots.forEach((dot, index) => {
            dot.classList.toggle('active', index === currentIndex);
        });
        counter.textContent = `${currentIndex + 1} / ${totalSlides}`;
    }

    function goToSlide(index) {
        if (index < 0) index = 0;
        if (index >= totalSlides) index = totalSlides - 1;
        if (index === currentIndex) return;
        currentIndex = index;
        slidesContainer.style.transform = `translateX(-${currentIndex * 100}%)`;
        updateUI();
    }

    function nextSlide() {
        if (currentIndex < totalSlides - 1) goToSlide(currentIndex + 1);
    }

    function prevSlide() {
        if (currentIndex > 0) goToSlide(currentIndex - 1);
    }

    createDots();
    updateUI();
    applyLanguage('ru');

    prevBtn.addEventListener('click', prevSlide);
    nextBtn.addEventListener('click', nextSlide);

    window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight') { e.preventDefault(); nextSlide(); }
        else if (e.key === 'ArrowLeft') { e.preventDefault(); prevSlide(); }
    });

    let touchStartX = 0;
    let touchEndX = 0;

    slidesContainer.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    slidesContainer.addEventListener('touchend', (e) => {
        touchEndX = e.changedTouches[0].screenX;
        const diff = touchStartX - touchEndX;
        if (Math.abs(diff) > 50) {
            if (diff > 0) nextSlide();
            else prevSlide();
        }
    }, { passive: true });

    slidesContainer.style.transform = 'translateX(0)';
})();
