<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Правила дорожного движения / Traffic Rules</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            background: linear-gradient(145deg, #1a2634 0%, #0f1722 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .presentation-wrapper {
            max-width: 1100px;
            width: 100%;
            position: relative;
        }

        /* Переключатель языка */
        .lang-switch {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-bottom: 14px;
        }

        .lang-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1.5px solid rgba(255, 215, 0, 0.35);
            color: #a0b2c9;
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.2s;
            backdrop-filter: blur(5px);
        }

        .lang-btn:hover {
            border-color: #ffd966;
            color: #ffd966;
        }

        .lang-btn.active {
            background: #ffd966;
            color: #0b1219;
            border-color: #ffd966;
            box-shadow: 0 0 18px rgba(255, 215, 0, 0.45);
        }

        /* Слайдер контейнер */
        .slider-container {
            position: relative;
            border-radius: 32px;
            overflow: hidden;
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 215, 0, 0.2);
            background: #0b1219;
            transition: box-shadow 0.3s;
        }

        .slider-container:hover {
            box-shadow: 0 35px 60px rgba(0, 0, 0, 0.8), 0 0 0 2px rgba(255, 215, 0, 0.4);
        }

        .slides {
            display: flex;
            transition: transform 0.45s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            will-change: transform;
        }

        .slide {
            flex: 0 0 100%;
            padding: 48px 40px 56px;
            min-height: 580px;
            display: flex;
            flex-direction: column;
            background: radial-gradient(circle at 20% 30%, #1e2b3c, #0e151f 90%);
            color: #eef5ff;
            border-right: 1px solid rgba(255, 215, 0, 0.1);
        }

        .slide h1 {
            font-size: 3.2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            line-height: 1.2;
            color: #ffffff;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            margin-bottom: 8px;
            position: relative;
        }

        .slide h1::after {
            content: '';
            display: block;
            width: 120px;
            height: 5px;
            background: linear-gradient(90deg, #ffd966, #ffb347, #ffd966);
            border-radius: 4px;
            margin-top: 14px;
            box-shadow: 0 0 15px rgba(255, 180, 60, 0.6);
        }

        .slide h2 {
            font-size: 2.0rem;
            font-weight: 600;
            color: #ffd966;
            margin-bottom: 24px;
            letter-spacing: -0.3px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .slide p {
            font-size: 1.2rem;
            line-height: 1.6;
            color: #cbd5e6;
            margin-bottom: 16px;
        }

        .highlight {
            color: #ffd966;
            font-weight: 600;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 22px;
            margin-top: 16px;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            margin-top: 16px;
        }

        .card {
            background: rgba(20, 30, 45, 0.8);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 215, 0, 0.25);
            border-radius: 22px;
            padding: 22px 20px;
            transition: transform 0.2s, border-color 0.2s;
            box-shadow: 0 10px 20px -8px rgba(0, 0, 0, 0.6);
        }

        .card:hover {
            border-color: #ffd966;
            transform: translateY(-3px);
            background: rgba(30, 42, 60, 0.95);
        }

        .card-icon {
            font-size: 2.4rem;
            margin-bottom: 10px;
            display: block;
        }

        .card h3 {
            font-size: 1.35rem;
            color: #ffd966;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .card p {
            font-size: 1rem;
            margin-bottom: 6px;
            color: #b8c7db;
        }

        .card ul {
            padding-left: 18px;
            margin: 8px 0 4px;
            color: #b8c7db;
            font-size: 0.98rem;
            line-height: 1.55;
        }

        .card li {
            margin-bottom: 5px;
        }

        .custom-list {
            list-style: none;
            padding: 0;
            margin-top: 12px;
        }

        .custom-list li {
            font-size: 1.1rem;
            padding: 10px 0 10px 36px;
            position: relative;
            border-bottom: 1px solid rgba(255, 215, 0, 0.1);
            color: #d7e2f0;
        }

        .custom-list li::before {
            content: "▹";
            position: absolute;
            left: 8px;
            color: #ffd966;
            font-weight: bold;
            font-size: 1.4rem;
        }

        .accent-block {
            background: rgba(255, 215, 0, 0.08);
            border-left: 6px solid #ffd966;
            padding: 20px 24px;
            border-radius: 16px;
            margin: 20px 0 10px;
            font-size: 1.18rem;
            color: #ebf0fa;
        }

        .sign-row {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
            font-size: 2.4rem;
            flex-wrap: wrap;
            gap: 12px;
        }

        .sign-item {
            background: #0c141e;
            padding: 14px 20px;
            border-radius: 16px;
            border: 1px solid rgba(255, 215, 0, 0.3);
            text-align: center;
            min-width: 100px;
        }

        .sign-item span {
            display: block;
            font-size: 0.85rem;
            color: #ffd966;
            margin-top: 6px;
            font-weight: 500;
        }

        .nav-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            margin-top: 28px;
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1.5px solid rgba(255, 215, 0, 0.5);
            color: #ffd966;
            width: 58px;
            height: 58px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: 400;
            cursor: pointer;
            transition: all 0.2s;
            backdrop-filter: blur(5px);
            line-height: 1;
            user-select: none;
        }

        .nav-btn:hover {
            background: #ffd966;
            color: #0b1219;
            border-color: #ffd966;
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.5);
        }

        .nav-btn:active {
            transform: scale(0.96);
        }

        .dots {
            display: flex;
            gap: 14px;
        }

        .dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: rgba(255, 215, 0, 0.25);
            cursor: pointer;
            transition: all 0.25s;
            border: 1px solid rgba(255, 215, 0, 0.4);
        }

        .dot.active {
            background: #ffd966;
            width: 36px;
            border-radius: 20px;
            box-shadow: 0 0 14px #ffd966;
            border-color: #ffd966;
        }

        .slide-counter {
            color: #a0b2c9;
            font-size: 1rem;
            font-weight: 500;
            letter-spacing: 2px;
            min-width: 70px;
            text-align: center;
        }

        .footer-note {
            color: #5f738b;
            margin-top: 18px;
            font-size: 0.9rem;
            text-align: center;
            letter-spacing: 0.5px;
        }

        @media (max-width: 760px) {
            .slide {
                padding: 32px 22px 40px;
                min-height: 520px;
            }
            .slide h1 {
                font-size: 2.2rem;
            }
            .slide h2 {
                font-size: 1.6rem;
            }
            .grid-2, .grid-3 {
                grid-template-columns: 1fr;
                gap: 16px;
            }
            .nav-btn {
                width: 48px;
                height: 48px;
                font-size: 1.6rem;
            }
            .nav-controls {
                gap: 16px;
            }
            .card {
                padding: 16px;
            }
            .sign-row {
                font-size: 1.8rem;
            }
            .accent-block {
                padding: 16px;
                font-size: 1rem;
            }
        }
    </style>
</head>

    /* ======================= ПЕРЕКЛЮЧЕНИЕ ЯЗЫКА ======================= */
    let currentLang = 'ru';

    function applyLanguage(lang) {
        currentLang = lang;
        const dict = translations[lang];

        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (dict[key] !== undefined) {
                el.innerHTML = dict[key];
            }
        });

        document.querySelectorAll('[data-i18n-html]').forEach(el => {
            const key = el.getAttribute('data-i18n-html');
            if (dict[key] !== undefined) {
                el.innerHTML = dict[key];
            }
        });

        document.getElementById('footerNote').textContent = dict.footer || '';

        // Обновить активную кнопку языка
        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.lang === lang);
        });

        // Обновить атрибут lang документа
        document.documentElement.lang = lang;

        // Обновить заголовок страницы
        document.title = lang === 'ru'
            ? 'Правила дорожного движения в России'
            : 'Road Traffic Rules in Russia';
    }

    document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            applyLanguage(btn.dataset.lang);
        });
    });

    /* ======================= СЛАЙДЕР ======================= */
    const slidesContainer = document.getElementById('slides');
    const slides = document.querySelectorAll('.slide');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const dotsContainer = document.getElementById('dotsContainer');
    const counter = document.getElementById('counter');
    const totalSlides = slides.length;
    let currentIndex = 0;

    function createDots() {
        dotsContainer.innerHTML = '';
        for (let i = 0; i < totalSlides; i++) {
            const dot = document.createElement('div');
            dot.classList.add('dot');
            if (i === 0) dot.classList.add('active');
            dot.addEventListener('click', () => goToSlide(i));
            dotsContainer.appendChild(dot);
        }
    }

    function updateUI() {
        const dots = document.querySelectorAll('.dot');
        dots.forEach((dot, index) => {
            dot.classList.toggle('active', index === currentIndex);
        });
        counter.textContent = `${currentIndex + 1} / ${totalSlides}`;
    }

    function goToSlide(index) {
        if (index < 0) index = 0;
        if (index >= totalSlides) index = totalSlides - 1;
        if (index === currentIndex) return;

        currentIndex = index;
        slidesContainer.style.transform = `translateX(-${currentIndex * 100}%)`;
        updateUI();
    }

    function nextSlide() {
        if (currentIndex < totalSlides - 1) goToSlide(currentIndex + 1);
    }

    function prevSlide() {
        if (currentIndex > 0) goToSlide(currentIndex - 1);
    }

    createDots();
    updateUI();

    // Применить язык по умолчанию
    applyLanguage('ru');

    prevBtn.addEventListener('click', prevSlide);
    nextBtn.addEventListener('click', nextSlide);

    window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight') { e.preventDefault(); nextSlide(); }
        else if (e.key === 'ArrowLeft') { e.preventDefault(); prevSlide(); }
    });

    // Свайпы
    let touchStartX = 0;
    let touchEndX = 0;

    slidesContainer.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    slidesContainer.addEventListener('touchend', (e) => {
        touchEndX = e.changedTouches[0].screenX;
        const diff = touchStartX - touchEndX;
        if (Math.abs(diff) > 50) {
            if (diff > 0) nextSlide();
            else prevSlide();
        }
    }, { passive: true });

    slidesContainer.style.transform = 'translateX(0)';
})();
</script>
