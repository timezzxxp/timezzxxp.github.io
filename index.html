<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ПДД-тян недовольно объясняет правила ~ цундере-презентация</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            background: linear-gradient(145deg, #2a1a2e 0%, #1a0f22 50%, #12081a 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        .presentation-wrapper {
            max-width: 1100px;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        .lang-switch {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-bottom: 14px;
        }

        .lang-btn {
            background: rgba(255, 105, 180, 0.08);
            border: 1.5px solid rgba(255, 105, 180, 0.35);
            color: #e0a8c8;
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .lang-btn.active {
            background: #ff69b4;
            color: #1a0f22;
            border-color: #ff69b4;
            box-shadow: 0 0 18px rgba(255, 105, 180, 0.55);
        }

        .slider-container {
            position: relative;
            border-radius: 32px;
            overflow: hidden;
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.75), 0 0 0 1px rgba(255, 105, 180, 0.25);
            background: #1a0f22;
        }

        .slides {
            display: flex;
            transition: transform 0.45s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            will-change: transform;
        }

        .slide {
            flex: 0 0 100%;
            padding: 40px 30px;
            min-height: 600px;
            display: flex;
            flex-direction: column;
            background: radial-gradient(circle at 20% 30%, #2e1c36, #150b1e 90%);
            color: #f3e4ee;
            border-right: 1px solid rgba(255, 105, 180, 0.12);
        }

        /* ... (остальные стили текста и карточек опущены для краткости, они такие же, как в предыдущем коде) ... */
        
        /* Специальные стили для картинок */
        .image-upload-box {
            background: rgba(255, 105, 180, 0.05);
            border: 2px dashed rgba(255, 105, 180, 0.4);
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .image-upload-box label {
            font-size: 0.9rem;
            color: #ff9ecf;
            font-weight: 600;
        }

        .image-upload-box input {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255, 105, 180, 0.3);
            background: rgba(0, 0, 0, 0.3);
            color: white;
            font-size: 14px;
        }

        .image-upload-box input:focus {
            outline: none;
            border-color: #ff69b4;
        }

        .image-display-area {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 250px;
            position: relative;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 20px;
            overflow: hidden;
        }

        .image-display-area img {
            max-width: 100%;
            max-height: 350px;
            object-fit: contain;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        /* Стили для финального слайда с котом и стрелкой */
        .misha-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            position: relative;
            margin-top: 10px;
        }

        /* Анимация кота */
        .cat-misha {
            max-width: 200px;
            max-height: 200px;
            object-fit: contain;
            animation: breatheAndWiggle 2s ease-in-out infinite;
            filter: drop-shadow(0 10px 15px rgba(255, 105, 180, 0.4));
            z-index: 2;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
        }

        @keyframes breatheAndWiggle {
            0% { transform: scale(1) rotate(0deg); }
            25% { transform: scale(1.08) rotate(-3deg); }
            50% { transform: scale(1.02) rotate(0deg); }
            75% { transform: scale(1.08) rotate(3deg); }
            100% { transform: scale(1) rotate(0deg); }
        }

        /* Стрелка */
        .arrow-pointing {
            font-size: 5rem;
            color: #ff69b4;
            line-height: 1;
            transform: rotate(35deg);
            text-shadow: 0 0 20px rgba(255, 105, 180, 0.8);
            margin-right: -50px;
            margin-top: 20px;
            animation: pointAnim 1s infinite alternate ease-in-out;
            z-index: 1;
        }

        @keyframes pointAnim {
            from { transform: rotate(35deg) translateY(0); }
            to { transform: rotate(35deg) translateY(-15px); }
        }

        .misha-label {
            font-size: 2.2rem;
            font-weight: 900;
            color: #ff9ecf;
            text-transform: uppercase;
            text-shadow: 0 0 15px rgba(255, 105, 180, 0.9);
            margin-top: 15px;
            letter-spacing: 3px;
        }

        /* Навигация */
        .nav-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .nav-btn {
            background: rgba(255, 105, 180, 0.1);
            border: 1.5px solid rgba(255, 105, 180, 0.55);
            color: #ff9ecf;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .nav-btn:hover {
            background: #ff69b4;
            color: #1a0f22;
        }

        .dots {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(255, 105, 180, 0.25);
            cursor: pointer;
            border: 1px solid rgba(255, 105, 180, 0.45);
        }

        .dot.active {
            background: #ff69b4;
            width: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ff69b4;
        }

        .slide-counter {
            color: #b088a8;
            font-size: 1rem;
            font-weight: bold;
        }

        @media (max-width: 768px) {
            .slide { padding: 20px; min-height: 650px; }
            .arrow-pointing { font-size: 3.5rem; margin-right: -20px; }
            .misha-label { font-size: 1.5rem; }
            .cat-misha { max-width: 150px; }
            .image-display-area img { max-height: 250px; }
        }
    </style>
</head>
<body>
<div class="presentation-wrapper">
    <div class="lang-switch">
        <button class="lang-btn active">🇷🇺 RU</button>
    </div>

    <div class="slider-container">
        <div class="slides" id="slides">
            
            <!-- Пример слайда (пропущены для краткости, вставьте свои старые слайды 1-9) -->
            <div class="slide" style="justify-content: center; align-items: center; text-align: center;">
                <h1>ПДД-тян недовольно объясняет</h1>
                <p>Свайпайте вправо 👉</p>
            </div>

            <!-- НОВЫЙ СЛАЙД 10: Мамонт Данила и Бегемот Мирослав -->
            <div class="slide">
                <h2>🦣 Забавный дуэт</h2>
                <p>Данила (мамонт) гордо стоит на Мирославе (бегемоте) среди льдов.</p>
                
                <!-- Поле для вставки ссылки на мамонта -->
                <div class="image-upload-box">
                    <label>Вставьте прямую ссылку на картинку с мамонтом (Raw URL с GitHub):</label>
                    <input type="text" id="imgLink1" placeholder="https://raw.githubusercontent.com/.../mammoth.jpg" onchange="saveImage('imgLink1', 'mammothImg')">
                </div>

                <div class="image-display-area">
                    <!-- Здесь будет картинка. Если ссылка не введена, покажет заглушку -->
                    <img id="mammothImg" src="" alt="Мамонт Данила на бегемоте Мирославе" style="display:none;">
                    <div id="mammothFallback" style="color: #ff9ecf; text-align: center;">
                        <span style="font-size: 3rem;">🦣🦛</span><br>
                        Вставьте ссылку выше
                    </div>
                </div>
            </div>

            <!-- НОВЫЙ СЛАЙД 11: Кот Миша -->
            <div class="slide">
                <h2 style="justify-content: center;">🐱 Знакомьтесь, это...</h2>
                
                <!-- Поле для вставки ссылки на кота -->
                <div class="image-upload-box" style="width: 100%;">
                    <label>Вставьте прямую ссылку на картинку с котом (Raw URL с GitHub):</label>
                    <input type="text" id="imgLink2" placeholder="https://raw.githubusercontent.com/.../cat.png" onchange="saveImage('imgLink2', 'catImg')">
                </div>

                <div class="misha-container">
                    <!-- Стрелка -->
                    <div class="arrow-pointing">↘</div>
                    
                    <!-- Кот с анимацией -->
                    <div style="position: relative; display: inline-block;">
                        <img id="catImg" class="cat-misha" src="" alt="Кот Миша" style="display:none;">
                        <div id="catFallback" style="font-size: 5rem; animation: breatheAndWiggle 2s infinite;">🐱</div>
                    </div>
                    
                    <!-- Подпись -->
                    <div class="misha-label">Миша</div>
                </div>
            </div>

        </div>
    </div>

    <div class="nav-controls">
        <button class="nav-btn" id="prevBtn">←</button>
        <div class="dots" id="dotsContainer"></div>
        <span class="slide-counter" id="counter"></span>
        <button class="nav-btn" id="nextBtn">→</button>
    </div>
</div>

<script>
    // === СКРИПТ ДЛЯ СОХРАНЕНИЯ ССЫЛОК НА КАРТИНКИ В ПАМЯТИ ТЕЛЕФОНА ===
    function saveImage(inputId, imgId) {
        const url = document.getElementById(inputId).value.trim();
        const imgElement = document.getElementById(imgId);
        const fallbackElement = document.getElementById(imgId === 'mammothImg' ? 'mammothFallback' : 'catFallback');
        
        if (url) {
            imgElement.src = url;
            imgElement.style.display = 'block';
            fallbackElement.style.display = 'none';
            // Сохраняем ссылку в память телефона, чтобы не вводить заново
            localStorage.setItem(inputId, url);
        } else {
            imgElement.style.display = 'none';
            fallbackElement.style.display = 'block';
            localStorage.removeItem(inputId);
        }
    }

    // Восстановление ссылок при загрузке страницы
    window.addEventListener('DOMContentLoaded', () => {
        ['imgLink1', 'imgLink2'].forEach(inputId => {
            const savedUrl = localStorage.getItem(inputId);
            if (savedUrl) {
                document.getElementById(inputId).value = savedUrl;
                // Вызываем сохранение, чтобы применить
                saveImage(inputId, inputId === 'imgLink1' ? 'mammothImg' : 'catImg');
            }
        });
    });

    // === ЛОГИКА СЛАЙДЕРА ===
    const slidesContainer = document.getElementById('slides');
    const slides = document.querySelectorAll('.slide');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const dotsContainer = document.getElementById('dotsContainer');
    const counter = document.getElementById('counter');
    const totalSlides = slides.length;
    let currentIndex = 0;

    // Создаем точки
    for (let i = 0; i < totalSlides; i++) {
        const dot = document.createElement('div');
        dot.classList.add('dot');
        if (i === 0) dot.classList.add('active');
        dot.addEventListener('click', () => goToSlide(i));
        dotsContainer.appendChild(dot);
    }

    function updateUI() {
        const dots = document.querySelectorAll('.dot');
        dots.forEach((dot, index) => {
            dot.classList.toggle('active', index === currentIndex);
        });
        counter.textContent = `${currentIndex + 1} / ${totalSlides}`;
        // Прячем/показываем кнопки на краях
        prevBtn.style.opacity = currentIndex === 0 ? '0.3' : '1';
        nextBtn.style.opacity = currentIndex === totalSlides - 1 ? '0.3' : '1';
    }

    function goToSlide(index) {
        if (index < 0) index = 0;
        if (index >= totalSlides) index = totalSlides - 1;
        currentIndex = index;
        slidesContainer.style.transform = `translateX(-${currentIndex * 100}%)`;
        updateUI();
    }

    prevBtn.addEventListener('click', () => goToSlide(currentIndex - 1));
    nextBtn.addEventListener('click', () => goToSlide(currentIndex + 1));

    // Свайпы для телефона
    let touchStartX = 0;
    let touchEndX = 0;
    slidesContainer.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });
    
    slidesContainer.addEventListener('touchend', (e) => {
        touchEndX = e.changedTouches[0].screenX;
        const diff = touchStartX - touchEndX;
        if (Math.abs(diff) > 50) {
            if (diff > 0) goToSlide(currentIndex + 1);
            else goToSlide(currentIndex - 1);
        }
    }, { passive: true });

    updateUI();
</script>
</body>
</html>
